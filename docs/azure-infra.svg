<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>

  <!-- GitHub -->
  <rect x="20" y="50" width="190" height="320" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="115" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">GitHub Actions</text>
  <rect x="35" y="95" width="160" height="110" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <g text-anchor="middle" fill="#0c4a6e">
    <text x="115" y="117" font-size="13" font-weight="600" font-family="Consolas, monospace">app.yml</text>
    <text x="115" y="140" font-size="11">test, Trivy scan</text>
    <text x="115" y="157" font-size="11">build and push image</text>
    <text x="115" y="174" font-size="11">deploy canary 25%</text>
  </g>
  <rect x="35" y="230" width="160" height="110" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <g text-anchor="middle" fill="#4c1d95">
    <text x="115" y="252" font-size="13" font-weight="600" font-family="Consolas, monospace">infra.yml</text>
    <text x="115" y="278" font-size="11">terraform plan on PR</text>
    <text x="115" y="295" font-size="11">approval, then apply</text>
    <text x="115" y="312" font-size="11">destroy: manual only</text>
  </g>
  <text x="115" y="360" text-anchor="middle" font-size="10.5" fill="#475569">login via OIDC, no stored secrets</text>

  <!-- Azure -->
  <rect x="260" y="20" width="600" height="400" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="275" y="42" font-size="14" font-weight="600" fill="#0c4a6e">Azure resource group (created by Terraform)</text>

  <!-- column A -->
  <g text-anchor="middle">
    <rect x="285" y="60" width="140" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="355" y="85" font-size="13" font-weight="600" fill="#713f12">Container Registry</text>
    <text x="355" y="104" font-size="10.5" fill="#334155">app images (ACR)</text>

    <rect x="285" y="170" width="140" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="355" y="195" font-size="13" font-weight="600" fill="#7f1d1d">Key Vault</text>
    <text x="355" y="214" font-size="10.5" fill="#334155">OpenAI API key</text>

    <rect x="285" y="270" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="355" y="293" font-size="13" font-weight="600" fill="#14532d">Managed identity</text>
    <text x="355" y="312" font-size="10.5" fill="#334155">AcrPull, Secrets User</text>
  </g>

  <!-- Environment -->
  <rect x="470" y="60" width="370" height="260" rx="12" fill="#ffffff" stroke="#0284c7" stroke-dasharray="6 4"/>
  <text x="485" y="82" font-size="12" font-weight="600" fill="#0c4a6e">Container Apps environment</text>
  <rect x="490" y="100" width="330" height="200" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="655" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">Container App (multiple revisions)</text>
  <g text-anchor="middle">
    <rect x="505" y="160" width="145" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="577" y="185" font-size="13" font-weight="600" fill="#14532d">Revision A</text>
    <text x="577" y="205" font-size="12" fill="#334155">stable, 75%</text>
    <rect x="665" y="160" width="140" height="70" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text x="735" y="185" font-size="13" font-weight="600" fill="#7c2d12">Revision B</text>
    <text x="735" y="205" font-size="12" fill="#334155">canary, 25%</text>
    <text x="655" y="262" font-size="11" fill="#334155">public HTTPS ingress, port 8000</text>
    <text x="655" y="282" font-size="11" fill="#334155">QA checks, then a human sets 100%</text>
  </g>

  <!-- Log Analytics -->
  <rect x="650" y="345" width="190" height="55" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="745" y="369" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Log Analytics</text>
  <text x="745" y="387" text-anchor="middle" font-size="10.5" fill="#334155">app logs</text>

  <!-- State storage -->
  <rect x="20" y="400" width="190" height="75" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <g text-anchor="middle">
    <text x="115" y="428" font-size="13" font-weight="600" fill="#713f12">Storage account</text>
    <text x="115" y="447" font-size="11" fill="#334155">Terraform state</text>
    <text x="115" y="462" font-size="11" fill="#334155">(versioned, private)</text>
  </g>

  <!-- Outside -->
  <rect x="900" y="150" width="170" height="70" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="985" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">OpenAI API</text>
  <text x="985" y="202" text-anchor="middle" font-size="11" fill="#334155">LLM calls</text>

  <rect x="470" y="450" width="160" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="550" y="481" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">Users / QA</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="195" y1="112" x2="283" y2="92"/>
    <line x1="195" y1="145" x2="488" y2="145"/>
    <line x1="195" y1="285" x2="258" y2="285"/>
    <line x1="115" y1="371" x2="115" y2="398"/>
    <line x1="840" y1="185" x2="898" y2="185"/>
    <line x1="550" y1="448" x2="550" y2="322"/>
  </g>
  <g stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
    <line x1="468" y1="90" x2="427" y2="90"/>
    <line x1="468" y1="200" x2="427" y2="200"/>
    <line x1="427" y1="300" x2="468" y2="300"/>
    <line x1="745" y1="322" x2="745" y2="343"/>
  </g>
  <g font-size="10.5" fill="#0f172a" font-weight="600">
    <text x="300" y="140">update image, canary 25%</text>
    <text x="432" y="84">pull</text>
    <text x="428" y="194">secret</text>
    <text x="205" y="279">apply</text>
    <text x="558" y="400">HTTPS</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
