<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="20" y="140" width="130" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="85" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#0c4a6e">Browser</text>
  <text x="85" y="196" text-anchor="middle" font-size="11" fill="#334155">chat UI (index.html)</text>

  <!-- FastAPI -->
  <rect x="200" y="120" width="170" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="285" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">FastAPI</text>
  <text x="285" y="180" text-anchor="middle" font-size="12" fill="#14532d" font-family="Consolas, monospace">POST /api/ask</text>
  <text x="285" y="202" text-anchor="middle" font-size="11" fill="#334155">validates input</text>
  <text x="285" y="218" text-anchor="middle" font-size="11" fill="#334155">safe fallback on errors</text>

  <!-- Agent -->
  <rect x="420" y="30" width="330" height="330" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="585" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">LangGraph agent (state per thread_id)</text>

  <g font-size="11" fill="#334155" text-anchor="middle">
    <rect x="450" y="65" width="270" height="50" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="585" y="87" font-size="14" font-weight="600" fill="#7f1d1d">Guardrail</text>
    <text x="585" y="104">blocks injection and off-topic</text>

    <rect x="450" y="140" width="270" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="585" y="162" font-size="14" font-weight="600" fill="#713f12">Retrieve</text>
    <text x="585" y="179">knowledge-base lookup</text>

    <rect x="450" y="215" width="270" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="585" y="237" font-size="14" font-weight="600" fill="#4c1d95">Generate</text>
    <text x="585" y="254">answers from retrieved context only</text>

    <rect x="450" y="290" width="270" height="50" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text x="585" y="312" font-size="14" font-weight="600" fill="#7c2d12">Verify</text>
    <text x="585" y="329">grounding check, else handover</text>
  </g>
  <g stroke="#475569" stroke-width="1.8" marker-end="url(#a)">
    <line x1="585" y1="115" x2="585" y2="138"/>
    <line x1="585" y1="190" x2="585" y2="213"/>
    <line x1="585" y1="265" x2="585" y2="288"/>
  </g>

  <!-- OpenAI -->
  <rect x="820" y="130" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="895" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">OpenAI API</text>
  <text x="895" y="194" text-anchor="middle" font-size="11" fill="#334155">LLM calls</text>
  <text x="895" y="210" text-anchor="middle" font-size="11" fill="#334155">(key from Key Vault)</text>

  <!-- Langfuse -->
  <rect x="820" y="265" width="150" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="895" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Langfuse</text>
  <text x="895" y="316" text-anchor="middle" font-size="11" fill="#64748b">optional tracing</text>

  <!-- Outer arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="150" y1="168" x2="198" y2="168"/>
    <line x1="370" y1="168" x2="418" y2="168"/>
    <line x1="752" y1="178" x2="818" y2="178" marker-start="url(#a)"/>
    <line x1="752" y1="300" x2="818" y2="300" stroke-dasharray="6 4"/>
  </g>
  <g stroke="#475569" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#a)">
    <line x1="198" y1="198" x2="152" y2="198"/>
    <line x1="418" y1="198" x2="372" y2="198"/>
  </g>
  <g font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">
    <text x="175" y="158">1</text>
    <text x="394" y="158">2</text>
    <text x="785" y="168">3</text>
    <text x="175" y="218">4</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <text x="20" y="300" font-weight="600">Flow</text>
    <text x="20" y="320">1  question + thread_id</text>
    <text x="20" y="338">2  ask(question, thread_id)</text>
    <text x="20" y="356">3  model calls</text>
    <text x="20" y="374">4  answer, outcome, thread_id</text>
  </g>
  <text x="585" y="385" text-anchor="middle" font-size="12" fill="#334155">outcome: answered | handover (a human takes over) | blocked | error</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
